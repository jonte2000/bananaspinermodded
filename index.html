<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Modded Banana Spinner</title>

<style>
*{box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#fff;
}

body{
    font-family:Arial,sans-serif;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

#game{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* MODDED LABEL */

#modded{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);

    font-size:18px;
    font-weight:bold;

    color:#222;

    z-index:20;
}

/* BANANA */

#bananaArea{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

#banana{
    font-size:clamp(150px,25vw,280px);
    line-height:1;

    display:inline-block;

    cursor:pointer;
    touch-action:manipulation;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;

    outline:none !important;
    border:none;

    -webkit-tap-highlight-color:transparent;

    will-change:transform;

    transform-origin:center;

    filter:drop-shadow(
        0 15px 15px rgba(0,0,0,.12)
    );
}

#banana:focus,
#banana:focus-visible,
#banana:active{
    outline:none !important;
    box-shadow:none !important;
}

/* TOP */

#topbar{
    position:absolute;
    top:50px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:30;
}

#coins{
    padding:9px 13px;

    background:white;

    border:1px solid #ddd;
    border-radius:12px;

    font-weight:bold;

    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

#shopButton{
    padding:9px 14px;

    background:white;

    border:1px solid #ddd;
    border-radius:12px;

    cursor:pointer;

    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

/* STATS */

#stats{
    position:absolute;

    left:12px;
    right:12px;
    bottom:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:10px;
    flex-wrap:wrap;

    pointer-events:none;

    z-index:15;
}

.stat{
    padding:7px 11px;

    background:rgba(255,255,255,.9);

    border:1px solid #ddd;
    border-radius:10px;

    font-size:14px;

    white-space:nowrap;
}

/* COMBO */

#combo{
    position:absolute;

    top:19%;
    left:50%;

    transform:translateX(-50%);

    font-size:23px;
    font-weight:bold;

    opacity:0;

    pointer-events:none;

    z-index:15;

    transition:opacity .15s;
}

#combo.active{
    opacity:1;
}

/* FLOATING TEXT */

.float{
    position:absolute;

    pointer-events:none;
    z-index:100;

    font-size:18px;
    font-weight:bold;

    animation:floatUp .8s ease-out forwards;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translate(-50%,0);
    }

    to{
        opacity:0;
        transform:translate(-50%,-75px);
    }
}

/* SHOP */

#shop{
    position:absolute;

    top:95px;
    right:15px;

    width:min(430px,calc(100% - 30px));
    max-height:calc(100% - 125px);

    padding:15px;

    background:white;

    border:1px solid #ddd;
    border-radius:16px;

    box-shadow:0 15px 50px rgba(0,0,0,.18);

    overflow-y:auto;

    display:none;

    z-index:100;
}

#shop.open{
    display:block;
}

#shopHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:12px;
}

#shopHeader h2{
    margin:0;
}

#closeShop{
    width:34px;
    height:34px;

    border:0;
    border-radius:9px;

    background:#f1f1f1;

    font-size:21px;

    cursor:pointer;
}

/* UPGRADES */

.upgrade{
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    padding:12px;

    margin-bottom:8px;

    background:#fafafa;

    border:1px solid #ddd;
    border-radius:11px;

    text-align:left;

    cursor:pointer;

    transition:.12s;
}

.upgrade:hover:not(:disabled){
    transform:translateY(-2px);
    background:#fff;
}

.upgrade:disabled{
    opacity:.4;
    cursor:default;
}

.upgradeName{
    font-weight:bold;
    margin-bottom:4px;
}

.upgradeDescription{
    font-size:12px;
    color:#777;
}

.upgradeRight{
    text-align:right;
    white-space:nowrap;
}

.upgradeCost{
    font-weight:bold;
}

.upgradeLevel{
    margin-top:3px;
    color:#888;
    font-size:11px;
}

/* MILESTONE */

#milestone{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%) scale(.8);

    opacity:0;

    z-index:200;

    padding:18px 25px;

    background:white;

    border:1px solid #ddd;
    border-radius:16px;

    box-shadow:0 15px 60px rgba(0,0,0,.2);

    text-align:center;

    pointer-events:none;

    transition:.25s;
}

#milestone.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

#milestoneTitle{
    font-size:23px;
    font-weight:bold;
}

#milestoneText{
    margin-top:5px;
    color:#777;
}

@media(max-width:600px){

    #topbar{
        top:48px;
        left:10px;
        right:10px;
    }

    #shop{
        top:88px;
        right:10px;
        width:calc(100% - 20px);
        max-height:calc(100% - 105px);
    }

    #stats{
        bottom:10px;
    }

    .stat{
        font-size:12px;
        padding:6px 8px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="modded">
        Modded
    </div>

    <div id="topbar">

        <div id="coins">
            🍌 <span id="coinsValue">0</span>
        </div>

        <button id="shopButton" type="button">
            🛒 Upgrades
        </button>

    </div>


    <div id="bananaArea">
        <div id="banana">🍌</div>
    </div>


    <div id="combo">
        COMBO ×<span id="comboValue">1.0</span>
    </div>


    <div id="stats">

        <div class="stat">
            Spins: <b id="spins">0</b>
        </div>

        <div class="stat">
            Speed: <b id="speed">0.0</b> RPS
        </div>

        <div class="stat">
            Power: <b id="power">110</b>
        </div>

    </div>


    <div id="shop">

        <div id="shopHeader">

            <h2>🍌 Upgrades</h2>

            <button id="closeShop" type="button">
                ×
            </button>

        </div>

        <div id="upgradeList"></div>

    </div>


    <div id="milestone">

        <div id="milestoneTitle">
            🍌 MILESTONE!
        </div>

        <div id="milestoneText"></div>

    </div>

</div>


<script>
(() => {

"use strict";


/* =====================================
   ELEMENTS
===================================== */

const banana =
    document.getElementById("banana");

const coinsValue =
    document.getElementById("coinsValue");

const spinsDisplay =
    document.getElementById("spins");

const speedDisplay =
    document.getElementById("speed");

const powerDisplay =
    document.getElementById("power");

const combo =
    document.getElementById("combo");

const comboValue =
    document.getElementById("comboValue");

const shop =
    document.getElementById("shop");

const shopButton =
    document.getElementById("shopButton");

const closeShop =
    document.getElementById("closeShop");

const upgradeList =
    document.getElementById("upgradeList");

const milestone =
    document.getElementById("milestone");

const milestoneText =
    document.getElementById("milestoneText");


/* =====================================
   GAME STATE
===================================== */

let angle = 0;

let speed = 0;

let spins = 0;

let coins = 0;

let comboMultiplier = 1;

let comboTimer = 0;

let lastTime =
    performance.now();

let lastSave = 0;

let lastCompletedSpin = 0;

let milestoneIndex = 0;


/* =====================================
   30 UPGRADES
===================================== */

const upgrades = [

    ["Banana Grip","+25 click power",25,"click",25],
    ["Better Grip","+50 click power",75,"click",50],
    ["Golden Peel","+100 click power",200,"click",100],
    ["Banana Juice","+250 click power",600,"click",250],
    ["Turbo Banana","+600 click power",1500,"click",600],
    ["Rocket Peel","+1,500 click power",4000,"click",1500],
    ["Super Banana","+4,000 click power",10000,"click",4000],
    ["Banana Engine","+10,000 click power",30000,"click",10000],
    ["Banana Reactor","+30,000 click power",100000,"click",30000],
    ["Golden Engine","+100,000 click power",350000,"click",100000],

    ["Tiny Spinner","+2 passive RPS",100,"auto",2],
    ["Small Spinner","+5 passive RPS",300,"auto",5],
    ["Spin Motor","+15 passive RPS",1000,"auto",15],
    ["Turbo Motor","+40 passive RPS",4000,"auto",40],
    ["Banana Factory","+100 passive RPS",15000,"auto",100],
    ["Spin Factory","+300 passive RPS",50000,"auto",300],
    ["Mega Motor","+1,000 passive RPS",200000,"auto",1000],
    ["Quantum Motor","+3,000 passive RPS",750000,"auto",3000],

    ["Smooth Wheels","10% less friction",500,"friction",.10],
    ["Oil Machine","15% less friction",2500,"friction",.15],
    ["Liquid Banana","20% less friction",10000,"friction",.20],

    ["Lucky Banana","10% chance for 2x coins",1500,"crit",.10],
    ["Very Lucky Banana","15% chance for 2x coins",6000,"crit",.15],
    ["Golden Luck","20% chance for 3x coins",25000,"crit",.20],

    ["Spin Multiplier","+1 coin per spin",5000,"coins",1],
    ["Golden Multiplier","+5 coins per spin",25000,"coins",5],
    ["Diamond Multiplier","+20 coins per spin",100000,"coins",20],
    ["Banana Empire","+100 coins per spin",500000,"coins",100],
    ["Banana Dimension","+500 coins per spin",2500000,"coins",500],

    ["Infinity Banana","DOUBLE ALL MAJOR STATS",10000000,"ultimate",1]

];


const levels =
    new Array(upgrades.length).fill(0);


/* =====================================
   FORMAT NUMBERS
===================================== */

function formatNumber(n){

    n = Math.floor(
        Math.max(0,n)
    );

    if(n >= 1e15)
        return (n/1e15)
            .toFixed(1)
            .replace(".0","")
            + "Qa";

    if(n >= 1e12)
        return (n/1e12)
            .toFixed(1)
            .replace(".0","")
            + "T";

    if(n >= 1e9)
        return (n/1e9)
            .toFixed(1)
            .replace(".0","")
            + "B";

    if(n >= 1e6)
        return (n/1e6)
            .toFixed(1)
            .replace(".0","")
            + "M";

    if(n >= 1e3)
        return (n/1e3)
            .toFixed(1)
            .replace(".0","")
            + "K";

    return n.toLocaleString("en-US");
}


/* =====================================
   LOAD
===================================== */

try{

    const saved =
        JSON.parse(
            localStorage.getItem(
                "banana-spinner-modded-v1"
            )
        );

    if(saved){

        if(Number.isFinite(saved.angle))
            angle = saved.angle;

        if(Number.isFinite(saved.speed))
            speed = Math.max(
                0,
                saved.speed
            );

        if(Number.isFinite(saved.spins))
            spins = Math.max(
                0,
                Math.floor(saved.spins)
            );

        if(Number.isFinite(saved.coins))
            coins = Math.max(
                0,
                saved.coins
            );

        if(Array.isArray(saved.levels)){

            saved.levels.forEach(
                (level,index)=>{

                    if(
                        index < levels.length &&
                        Number.isFinite(level)
                    ){

                        levels[index] =
                            Math.max(
                                0,
                                Math.floor(level)
                            );

                    }

                }
            );

        }

        if(Number.isFinite(saved.milestoneIndex))
            milestoneIndex =
                Math.max(
                    0,
                    saved.milestoneIndex
                );
    }

}catch(_){}


/* =====================================
   UPGRADE CALCULATIONS
===================================== */

function ultimateMultiplier(){

    return levels[29] > 0
        ? Math.pow(2,levels[29])
        : 1;
}


function getClickPower(){

    let value = 110;

    upgrades.forEach(
        (upgrade,index)=>{

            if(upgrade[3] === "click"){

                value +=
                    upgrade[4] *
                    levels[index];

            }

        }
    );

    return value * ultimateMultiplier();
}


function getPassiveSpeed(){

    let value = 0;

    upgrades.forEach(
        (upgrade,index)=>{

            if(upgrade[3] === "auto"){

                value +=
                    upgrade[4] *
                    levels[index];

            }

        }
    );

    return value * ultimateMultiplier();
}


function getFriction(){

    let reduction = 0;

    upgrades.forEach(
        (upgrade,index)=>{

            if(upgrade[3] === "friction"){

                reduction +=
                    upgrade[4] *
                    levels[index];

            }

        }
    );

    reduction =
        Math.min(
            reduction,
            .9
        );

    return 1 - reduction;
}


function getCritChance(){

    let chance = 0;

    upgrades.forEach(
        (upgrade,index)=>{

            if(upgrade[3] === "crit"){

                chance +=
                    upgrade[4] *
                    levels[index];

            }

        }
    );

    return Math.min(
        chance,
        .75
    );
}


function getCoinsPerSpin(){

    let value = 1;

    upgrades.forEach(
        (upgrade,index)=>{

            if(upgrade[3] === "coins"){

                value +=
                    upgrade[4] *
                    levels[index];

            }

        }
    );

    return value * ultimateMultiplier();
}


/* =====================================
   SPIN
===================================== */

function spinBanana(){
    combo = Math.min(10, combo + 0.15);
    comboTimer = 1.5;

    const boost = getClickPower() * comboMultiplier();
    speed += boost;

    showFloatingText(
        "+" + Math.round(boost),
        window.innerWidth / 2,
        window.innerHeight / 2 - 90
    );


    combo.classList.add("active");

    comboValue.textContent =
        comboMultiplier.toFixed(1);


    banana.animate(
        [
            {transform:`rotate(${angle}deg) scale(1)`},
            {transform:`rotate(${angle}deg) scale(1.06)`},
            {transform:`rotate(${angle}deg) scale(1)`}
        ],
        {
            duration:120,
            easing:"ease-out"
        }
    );
}


/* =====================================
   MOUSE / TOUCH
===================================== */

banana.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        spinBanana(event);

    }
);


banana.addEventListener(
    "dragstart",
    event=>{

        event.preventDefault();

    }
);


/* =====================================
   KEYBOARD

   IMPORTANT:
   !event.repeat prevents holding
   Space or Enter from repeatedly
   adding speed.
===================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            (
                event.code === "Space" ||
                event.code === "Enter"
            ) &&
            !event.repeat
        ){

            event.preventDefault();

            spinBanana();

        }

    }
);


/* =====================================
   FLOATING TEXT
===================================== */

function showFloatingText(text,event){

    const el =
        document.createElement("div");

    el.className = "float";

    el.textContent = text;

    let x =
        window.innerWidth / 2;

    let y =
        window.innerHeight / 2;

    if(event){

        x = event.clientX;
        y = event.clientY;

    }

    el.style.left =
        x + "px";

    el.style.top =
        y + "px";

    document.body.appendChild(el);

    setTimeout(
        ()=>el.remove(),
        800
    );
}


/* =====================================
   COINS
===================================== */

function rewardSpin(){

    let reward =
        getCoinsPerSpin();

    if(
        Math.random() <
        getCritChance()
    ){

        reward *= 3;

        showFloatingText(
            "💥 CRIT +" +
            formatNumber(reward)
        );

    }

    coins += reward;
}


/* =====================================
   MILESTONES
===================================== */

const milestones = [

    [10,"First Banana Spin"],
    [100,"Banana Beginner"],
    [1000,"Banana Spinner"],
    [10000,"Banana Addict"],
    [100000,"Banana Master"],
    [1000000,"Banana Legend"],
    [10000000,"BANANA GOD"]

];


function checkMilestones(){

    while(
        milestoneIndex <
        milestones.length &&
        spins >=
        milestones[milestoneIndex][0]
    ){

        const milestoneData =
            milestones[milestoneIndex];

        milestoneIndex++;

        milestoneText.textContent =
            formatNumber(
                milestoneData[0]
            ) +
            " spins — " +
            milestoneData[1];

        milestone.classList.add("show");

        setTimeout(
            ()=>{
                milestone.classList.remove("show");
            },
            2200
        );

    }
}


/* =====================================
   COMPLETED SPINS
===================================== */

function processSpins(){

    const completed =
        Math.floor(
            angle / 360
        );

    if(
        completed <=
        lastCompletedSpin
    )
        return;


    const amount =
        completed -
        lastCompletedSpin;


    lastCompletedSpin =
        completed;


    spins += amount;


    for(
        let i=0;
        i<amount;
        i++
    ){

        rewardSpin();

    }


    checkMilestones();
}


/* =====================================
   SHOP
===================================== */

function getUpgradeCost(index){

    return Math.floor(
        upgrades[index][2] *
        Math.pow(
            1.65,
            levels[index]
        )
    );
}


function renderShop(){

    upgradeList.innerHTML = "";

    upgrades.forEach(
        (upgrade,index)=>{

            const cost =
                getUpgradeCost(index);

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "upgrade";

            button.disabled =
                coins < cost;


            button.innerHTML = `

                <div>

                    <div class="upgradeName">
                        ${index+1}. ${upgrade[0]}
                    </div>

                    <div class="upgradeDescription">
                        ${upgrade[1]}
                    </div>

                </div>

                <div class="upgradeRight">

                    <div class="upgradeCost">
                        ${formatNumber(cost)} 🍌
                    </div>

                    <div class="upgradeLevel">
                        Level ${levels[index]}
                    </div>

                </div>

            `;


            button.onclick =
                ()=>{
                    buyUpgrade(index);
                };


            upgradeList.appendChild(
                button
            );

        }
    );
}


function buyUpgrade(index){

    const cost =
        getUpgradeCost(index);

    if(coins < cost)
        return;


    coins -= cost;

    levels[index]++;


    renderShop();

    updateUI();

    save();
}


/* =====================================
   SHOP BUTTONS
===================================== */

shopButton.onclick = ()=>{

    shop.classList.toggle(
        "open"
    );

    if(shop.classList.contains("open"))
        renderShop();

};


closeShop.onclick = ()=>{

    shop.classList.remove(
        "open"
    );

};


/* =====================================
   SAVE
===================================== */

function save(){

    try{

        localStorage.setItem(
            "banana-spinner-modded-v1",
            JSON.stringify({
                angle,
                speed,
                spins,
                coins,
                levels,
                milestoneIndex
            })
        );

    }catch(_){}

}


/* =====================================
   UI
===================================== */

function updateUI(){

    coinsValue.textContent =
        formatNumber(coins);

    spinsDisplay.textContent =
        formatNumber(spins);

    speedDisplay.textContent =
        (speed / 360).toFixed(1);

    powerDisplay.textContent =
        formatNumber(
            getClickPower()
        );

}


/* =====================================
   GAME LOOP
===================================== */

function animate(now){

    const dt =
        Math.min(
            (now-lastTime)/1000,
            .05
        );

    lastTime = now;


    /*
    Passive speed
    */

    speed +=
        getPassiveSpeed() *
        360 *
        dt;


    /*
    Rotation
    */

    angle +=
        speed * dt;


    /*
    Completed spins
    */

    processSpins();


    /*
    Combo
    */

    if(comboTimer > 0){

        comboTimer -= dt;

    }else{

        comboMultiplier =
            Math.max(
                1,
                comboMultiplier -
                dt * 1.5
            );

        if(comboMultiplier <= 1.01){

            combo.classList.remove(
                "active"
            );

        }

    }


    /*
    Friction
    */

    const lowSpeedFriction =
        Math.max(
            0,
            8 - speed / 25
        ) * 8;


    const friction =
        (
            35 +
            lowSpeedFriction
        ) *
        getFriction();


    speed =
        Math.max(
            0,
            speed -
            friction * dt
        );


    /*
    Draw
    */

    banana.style.transform =
        `rotate(${angle}deg)`;


    comboValue.textContent =
        comboMultiplier.toFixed(1);


    updateUI();


    /*
    Autosave
    */

    if(
        now-lastSave >= 1000
    ){

        save();

        lastSave = now;

    }


    requestAnimationFrame(
        animate
    );

}


/* =====================================
   START
===================================== */

lastCompletedSpin =
    Math.floor(
        angle / 360
    );

updateUI();

requestAnimationFrame(
    animate
);

})();
</script>

</body>
</html>
